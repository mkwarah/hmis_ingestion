version: 2

models:
  - name: stg_dhis2__data_values
    description: >
      First transformation of the landed dataValueSets payloads: unnested,
      hoisted fields restored, current snapshot per data set and period,
      de-duplicated, typed, period parsed into dates, and personal data
      hashed. One row per current DHIS2 data value.
    columns:
      - name: data_value_key
        description: md5 of data set + DHIS2 natural key (surrogate key).
        data_tests: [unique, not_null]
      - name: data_set_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dhis2__data_sets')
                field: data_set_id
      - name: data_element_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dhis2__data_elements')
                field: data_element_id
      - name: org_unit_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dhis2__organisation_units')
                field: org_unit_id
      - name: category_option_combo_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dhis2__category_option_combos')
                field: category_option_combo_id
      - name: attribute_option_combo_id
        description: Restored from the payload level when DHIS2 hoisted it.
        data_tests: [not_null]
      - name: period
        data_tests: [not_null]
      - name: period_type
        description: Parsed from the period ID. Null means a format the macro does not know.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Daily, Weekly, WeeklyWednesday, WeeklyThursday, WeeklySaturday,
                         WeeklySunday, Monthly, Quarterly, SixMonthly, Yearly]
      - name: period_start_date
        data_tests: [not_null]
      - name: period_end_date
        data_tests: [not_null]
      - name: value_raw
        description: The value exactly as DHIS2 sent it (text).
      - name: value_numeric
        description: value_raw as a number; null for non-numeric values.
      - name: stored_by_hash
        description: >
          Salted SHA-256 of the DHIS2 user who entered the value (storedBy).
          Pseudonymised: groupable per user, not reversible without the salt.
          Dropped in intermediate.
        meta: {pii: pseudonymised}
      - name: comment
        description: Free-text data-entry comment. May contain personal data; dropped in intermediate.
        meta: {pii: true}
      - name: run_id
        description: Ingestion run the value was last landed in (lineage).
      - name: load_mode
        data_tests:
          - accepted_values:
              arguments:
                values: [full, incremental]

  - name: stg_dhis2__data_elements
    columns:
      - name: data_element_id
        data_tests: [unique, not_null]
      - name: data_element_name
        data_tests: [not_null]

  - name: stg_dhis2__organisation_units
    columns:
      - name: org_unit_id
        data_tests: [unique, not_null]
      - name: org_unit_name
        data_tests: [not_null]
      - name: org_unit_level
        data_tests: [not_null]

  - name: stg_dhis2__category_option_combos
    columns:
      - name: category_option_combo_id
        data_tests: [unique, not_null]

  - name: stg_dhis2__data_sets
    columns:
      - name: data_set_id
        data_tests: [unique, not_null]
      - name: assigned_org_units
        description: Number of org units the form is assigned to.

  - name: stg_dhis2__data_set_org_units
    description: Data set assignments, one row per (data set, assigned org unit).
    columns:
      - name: data_set_org_unit_key
        data_tests: [unique, not_null]
      - name: data_set_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_dhis2__data_sets')
                field: data_set_id
      - name: org_unit_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dhis2__organisation_units')
                field: org_unit_id
