version: 2

models:
  - name: dim_org_unit
    description: Organisation units with country, district, chiefdom and facility.
    columns:
      - name: org_unit_id
        data_tests: [unique, not_null]
      - name: org_unit_name
        data_tests: [not_null]

  - name: fct_monthly_indicators_district
    description: >
      Monthly totals per district for monthly data sets.
      Grain: data set x month x district x data element x disaggregation.
    columns:
      - name: district_name
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_org_unit')
                field: district_name
      - name: value
        data_tests: [not_null]

  - name: fct_weekly_idsr_district
    description: >
      Weekly IDSR totals per district on ISO weeks (Wednesday weeks fill
      weeks without an ISO report).
      Grain: week x district x data element x disaggregation.
    columns:
      - name: week_start
        description: Monday the ISO week starts on.
      - name: value
        data_tests: [not_null]

  - name: fct_reporting_monthly_district
    description: >
      Reporting rate per monthly data set, month and district: assigned
      facilities that reported any value / facilities assigned the form.
    columns:
      - name: facilities_expected
        description: Facilities the form is assigned to in the district (DHIS2 data set assignments).
        data_tests: [not_null]
      - name: facilities_reporting
        description: Assigned facilities that reported at least one value that month.
      - name: reporting_rate_pct
        data_tests: [not_null]
      - name: facilities_reporting_unassigned
        description: Facilities that reported but are not assigned the form (a data quality signal).

  - name: fct_indicators_monthly_district
    description: >
      Derived indicators (coverage, dropout, low birth weight, stillbirth
      rate) per district and month, with numerator and denominator so they
      can be re-aggregated correctly: sum(numerator) / sum(denominator) * multiplier.
    columns:
      - name: indicator_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [IMM_BCG_COV, IMM_PENTA3_COV, IMM_MEASLES_COV, IMM_PENTA_DROPOUT,
                         MAT_ANC1_COV, MAT_ANC_DROPOUT, MAT_LBW_PCT, MAT_STILLBIRTH_RATE]
      - name: denominator
        description: >
          Coverage indicators use the yearly Population data set / 12. Null
          when the district has no population figure for that year.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: value
        description: numerator / denominator * multiplier for the district-month, rounded to 0.1.
