# HMIS ingestion configuration
# ---------------------------------------------------------------------------
# Values of the form ${VAR:-default} are read from the environment (or a .env
# file next to this config). Keep real credentials out of this file.

source:
  name: dhis2_demo
  system: dhis2
  # Public DHIS2 demo (Sierra Leone database). The play server rotates
  # versions; if this URL stops working, pick a current one from
  # https://play.dhis2.org and set DHIS2_BASE_URL.
  base_url: ${DHIS2_BASE_URL:-https://play.im.dhis2.org/stable-2-43-2-1}
  username: ${DHIS2_USERNAME:-admin}
  password: ${DHIS2_PASSWORD:-district}
  timeout_seconds: 180
  max_retries: 5
  page_size: 1000

# Silo (community fork of MinIO) or any S3-compatible store.
datalake:
  endpoint: ${MINIO_ENDPOINT:-localhost:9100}   # host:port, no scheme
  access_key: ${MINIO_ACCESS_KEY:-minioadmin}
  secret_key: ${MINIO_SECRET_KEY:-minioadmin}
  secure: ${MINIO_SECURE:-false}                # true when MinIO is behind TLS
  region: ${MINIO_REGION:-}
  bucket: ${MINIO_BUCKET:-hmis-datalake}
  # Layout inside the bucket:
  #   landing/       - DHIS2 API payloads exactly as received (gzipped JSON),
  #                    one object per request, every run kept. No transformation.
  #   staging/ intermediate/ - written by dbt (dbt/lake), not by ingestion
  #   _state/        - incremental watermarks;  _runs/ - per-run manifests
  landing_prefix: landing/dhis2
  state_prefix: _state/dhis2
  runs_prefix: _runs/dhis2

ingestion:
  # full        - re-pull the last `lookback_months` (a fresh snapshot of them)
  # incremental - pull only values changed since the last successful run
  #               (falls back to full on the first run of a dataset)
  mode: incremental
  lookback_months: 12
  # Full loads are split into calendar-month requests. Each window starts
  # `overlap_days` early so weekly periods crossing a month boundary are not
  # dropped (DHIS2 only returns periods wholly inside the window).
  chunk_months: 1
  overlap_days: 7

# After ingestion the pipeline runs `dbt build` in each project, in order:
#   lake      (dbt-duckdb)     landing -> staging -> intermediate, Parquet in Silo
#   warehouse (dbt-clickhouse) intermediate in Silo -> gold marts in ClickHouse
# A failing model or test stops the run, so gold is never built from bad data.
transform:
  enabled: true
  # dbt lives in its own virtualenv; point at its executable.
  dbt_executable: ${DBT_EXECUTABLE:-dbt}
  projects:                     # relative paths are resolved from this file
    lake: dbt/lake
    warehouse: dbt/warehouse
  # Extra environment for dbt (MINIO_* and CLICKHOUSE_* are passed through).
  env:
    HMIS_DUCKDB_PATH: ${HMIS_DUCKDB_PATH:-~/hmis-data/hmis_lake.duckdb}
  # After each build, regenerate the dbt docs site (served on :8085).
  docs: true

# Email when a pipeline run fails or crashes (DHIS2 extract, dbt model or
# dbt test). Defaults deliver to the local Mailpit inbox
# (http://localhost:8025); set SMTP_* in .env for a real mail server, e.g.
# Office 365: SMTP_HOST=smtp.office365.com SMTP_PORT=587 SMTP_STARTTLS=true.
alerts:
  enabled: ${ALERTS_ENABLED:-true}
  prefect_ui: ${PREFECT_UI_URL:-http://localhost:4200}
  email:
    smtp_host: ${SMTP_HOST:-localhost}
    smtp_port: ${SMTP_PORT:-1025}
    starttls: ${SMTP_STARTTLS:-false}
    username: ${SMTP_USERNAME:-}
    password: ${SMTP_PASSWORD:-}
    from: ${ALERT_EMAIL_FROM:-hmis-pipeline@localhost}
    to: ${ALERT_EMAIL_TO:-data-team@localhost}

# Metadata snapshots, landed as received every run; dbt joins them to values.
metadata:
  - name: data_elements
    resource: dataElements
    fields: id,code,name,shortName,valueType,aggregationType,domainType,lastUpdated
  - name: organisation_units
    resource: organisationUnits
    fields: id,code,name,shortName,level,path,parent[id],openingDate,closedDate,lastUpdated
  - name: category_option_combos
    resource: categoryOptionCombos
    fields: id,code,name,lastUpdated
  - name: data_sets
    resource: dataSets
    # organisationUnits = the facilities assigned to report the form, the
    # denominator of the reporting rate.
    fields: id,code,name,periodType,lastUpdated,organisationUnits[id]

# Aggregate data sets to ingest. `org_unit` is the root of the hierarchy to
# pull; with `children: true` all descendants are included. `chunk_months`
# can be overridden per data set (e.g. 3 for quarterly, 12 for yearly).
datasets:
  - key: child_health
    id: BfMAe6Itzgt
    org_unit: ImspTQPwCqd        # Sierra Leone (national)
    children: true
    enabled: true
  - key: reproductive_health
    id: QX4ZTUbOt3a
    org_unit: ImspTQPwCqd
    children: true
    enabled: true
  - key: idsr_weekly
    id: Nyh6laLdBEJ
    org_unit: ImspTQPwCqd
    children: true
    enabled: true
  # Yearly population estimates: denominators for coverage indicators.
  - key: population
    id: aLpVgfXiz0f
    org_unit: ImspTQPwCqd
    children: true
    chunk_months: 12             # one request per calendar year
    enabled: true
  - key: art_monthly_summary
    id: lyLU2wR22tC
    org_unit: ImspTQPwCqd
    children: true
    enabled: false
