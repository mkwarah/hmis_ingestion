# Prefect project file for the HMIS pipeline.
#
# Every deployment runs `hmis_pipeline`: ingestion (DHIS2 -> Silo), then
# dbt build of the lake (Silo) and of the warehouse (ClickHouse). A failure
# at any step stops the run.
#
# One-time setup (in WSL, with the ingestion venv active):
#   prefect profile create hmis
#   prefect --profile hmis config set PREFECT_API_URL=http://localhost:4200/api
#   prefect profile use hmis
#   prefect work-pool create hmis-process-pool --type process
#   prefect deploy --all
#
# Then keep a worker running (it executes the scheduled runs):
#   export HMIS_PROJECT_DIR="$(pwd)"
#   prefect worker start --pool hmis-process-pool
#
# The worker reads MINIO_*, CLICKHOUSE_* and DBT_EXECUTABLE from the .env
# file in this directory (see .env.example).

name: hmis-data-ingestion
prefect-version: 3.4.0

build: null
push: null

# The process worker runs code from this directory. Set HMIS_PROJECT_DIR on
# the worker machine to the folder that contains dataset_ingestion.py.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $HMIS_PROJECT_DIR }}"

definitions:
  work_pools:
    hmis_pool: &hmis_pool
      name: hmis-process-pool
      work_queue_name: default
  tags: &tags
    - hmis
    - dhis2
    - datalake
    - dbt

deployments:
  # Daily: changes since the last run, then rebuild lake and gold.
  - name: hmis-daily-incremental
    description: Daily incremental DHIS2 ingestion, then dbt lake and warehouse builds.
    entrypoint: dataset_ingestion.py:hmis_pipeline
    tags: *tags
    parameters:
      config_path: ingestion_config.yml
      mode: incremental
    work_pool: *hmis_pool
    concurrency_limit: 1
    schedules:
      - cron: "0 2 * * *"
        timezone: Africa/Kigali
        active: true

  # Weekly: reload the last 12 months to pick up deletions and anything the
  # incremental runs could have missed, then rebuild.
  - name: hmis-weekly-full-refresh
    description: Weekly full reload of the last 12 months, then dbt lake and warehouse builds.
    entrypoint: dataset_ingestion.py:hmis_pipeline
    tags: *tags
    parameters:
      config_path: ingestion_config.yml
      mode: full
      lookback_months: 12
    work_pool: *hmis_pool
    concurrency_limit: 1
    schedules:
      - cron: "0 3 * * 0"
        timezone: Africa/Kigali
        active: true

  # Manual backfills: run with custom parameters from the UI or CLI, e.g.
  #   prefect deployment run "hmis-pipeline/hmis-backfill" \
  #     -p lookback_months=36 -p 'datasets=["child_health"]'
  # Add -p with_dbt=false to ingest without rebuilding the models.
  - name: hmis-backfill
    description: On-demand full backfill, then dbt builds; no schedule.
    entrypoint: dataset_ingestion.py:hmis_pipeline
    tags: *tags
    parameters:
      config_path: ingestion_config.yml
      mode: full
      lookback_months: 24
    work_pool: *hmis_pool
