# Prefect project file for the HMIS ingestion pipeline.
#
#   prefect work-pool create hmis-process-pool --type process
#   prefect deploy --all
#   prefect worker start --pool hmis-process-pool
#
# Workers need the environment variables from .env.example (DHIS2_* and
# MINIO_*), either exported in the worker's shell or in a .env file in this
# directory.

name: hmis-data-ingestion
prefect-version: 3.4.0

build: null
push: null

# The process worker runs code from this directory. Set HMIS_PROJECT_DIR on
# the worker machine to the folder that contains dataset_ingestion.py.
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $HMIS_PROJECT_DIR }}"

definitions:
  work_pools:
    hmis_pool: &hmis_pool
      name: hmis-process-pool
      work_queue_name: default
  tags: &tags
    - hmis
    - dhis2
    - datalake

deployments:
  # Daily incremental pull of everything changed since the last run.
  - name: hmis-dhis2-incremental
    description: Daily incremental ingestion of DHIS2 aggregate data into MinIO.
    entrypoint: dataset_ingestion.py:hmis_ingestion
    tags: *tags
    parameters:
      config_path: ingestion_config.yml
      mode: incremental
    work_pool: *hmis_pool
    concurrency_limit: 1
    schedules:
      - cron: "0 2 * * *"
        timezone: Africa/Kigali
        active: true

  # Weekly full refresh of the lookback window to pick up deletions and
  # anything the incremental runs could have missed.
  - name: hmis-dhis2-full-refresh
    description: Weekly full reload of the last 12 months.
    entrypoint: dataset_ingestion.py:hmis_ingestion
    tags: *tags
    parameters:
      config_path: ingestion_config.yml
      mode: full
      lookback_months: 12
    work_pool: *hmis_pool
    concurrency_limit: 1
    schedules:
      - cron: "0 3 * * 0"
        timezone: Africa/Kigali
        active: true

  # Manual backfills: run with custom parameters from the UI or CLI, e.g.
  #   prefect deployment run "hmis-dataset-ingestion/hmis-dhis2-backfill" \
  #     -p lookback_months=36 -p 'datasets=["child_health"]'
  - name: hmis-dhis2-backfill
    description: On-demand full backfill; no schedule.
    entrypoint: dataset_ingestion.py:hmis_ingestion
    tags: *tags
    parameters:
      config_path: ingestion_config.yml
      mode: full
      lookback_months: 24
    work_pool: *hmis_pool
